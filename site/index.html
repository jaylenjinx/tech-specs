<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a tech-office binder. Sticky venue tabs, then each venue reads top-down:
   status strip > key numbers > rig > patch sheet > drawings > stage/power/audio > sources. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#151a21; --muted:#5b6673; --line:#d9dfe6;
  --accent:#0b6e86; --accent-ink:#ffffff; --tape:#1d232b;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fbefd9; --bad:#a3302a; --bad-bg:#f8e2e0;
  --row:#f7f9fb; --hl:#fff3c4;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101419; --panel:#171c23; --ink:#e7ecf1; --muted:#97a3b0; --line:#2a323c;
  --accent:#3cc3df; --accent-ink:#0b1216; --tape:#0a0d11;
  --ok:#6fd39f; --ok-bg:#163326; --warn:#f2b552; --warn-bg:#3a2a10; --bad:#f08a82; --bad-bg:#3b1a18;
  --row:#1b2129; --hl:#4a3f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101419; --panel:#171c23; --ink:#e7ecf1; --muted:#97a3b0; --line:#2a323c;
  --accent:#3cc3df; --accent-ink:#0b1216; --tape:#0a0d11;
  --ok:#6fd39f; --ok-bg:#163326; --warn:#f2b552; --warn-bg:#3a2a10; --bad:#f08a82; --bad-bg:#3b1a18;
  --row:#1b2129; --hl:#4a3f12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--tape)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{background:var(--tape);color:#e9edf1}
.mast .wrap{padding-block:22px 0}
.mast h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.mast p{margin:4px 0 0;color:#a9b4bf;font-size:15px;max-width:70ch}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--tape);border-bottom:3px solid var(--accent)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:14px 0;scrollbar-width:none}
.tab{appearance:none;border:0;background:transparent;color:#aeb8c2;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px 9px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

main .wrap{padding-block:28px 60px}
.venue{display:grid;gap:28px}
.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;align-items:flex-end}
.vhead h2{font-size:clamp(30px,5vw,44px);font-weight:700;text-transform:uppercase}
.vhead .addr{color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.bad{color:var(--bad);background:var(--bad-bg)}

.note{border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:0 6px 6px 0;font-size:15px;max-width:80ch}
.note strong{color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{background:var(--panel);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}

section.block{display:grid;gap:12px;min-width:0}
.bh{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bh h3{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.bh .src{font-size:13px;color:var(--muted)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cols>*{min-width:0}
.kv{width:100%;border-collapse:collapse;font-size:15px}
.kv th{text-align:left;font-weight:500;color:var(--muted);padding:6px 10px 6px 0;vertical-align:top;width:52%}
.kv td{padding:6px 0;font-variant-numeric:tabular-nums}
.kv tr+tr th,.kv tr+tr td{border-top:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.card h4{margin:0;font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.card ul{margin:0;padding-left:18px}
.card li{margin:2px 0}
.qty{font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:6px}

/* patch sheet */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input{font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0;flex:1 1 220px;max-width:360px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.count{font-size:13px;color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.patch{border-collapse:collapse;width:100%;font-size:14px;min-width:720px}
.patch th{position:sticky;top:0;background:var(--panel);text-align:left;font-family:var(--display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
.patch td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.patch tbody tr:nth-child(even){background:var(--row)}
.patch td.n{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.patch td.fid{font-weight:600}
.patch tr.grp td{background:var(--bg);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent);padding:5px 10px}
.patch mark{background:var(--hl);color:inherit;border-radius:2px}
.uni{display:inline-block;min-width:26px;text-align:center;padding:0 5px;border-radius:4px;background:var(--bg);border:1px solid var(--line);margin-right:4px}
.empty{padding:16px;color:var(--muted)}

/* drawings */
.drawings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
figure{margin:0;display:grid;gap:6px;min-width:0}
figure a{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:zoom-in}
figure img{display:block;width:100%;height:auto}
figcaption{font-size:14px;color:var(--muted)}
figcaption b{color:var(--ink);font-weight:600}

.srcs{display:grid;gap:6px;font-size:15px;padding-left:18px;margin:0}
.srcs .d{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}

.lightbox{position:fixed;inset:0;z-index:20;background:rgba(8,10,13,.88);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 48px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.lightbox[hidden]{display:none}
.lightbox .inner{background:#fff;border-radius:6px;max-width:100%;max-height:100%;overflow:auto}
.lightbox img{display:block;max-width:none;width:min(2200px,180vw)}
.lightbox button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));font:600 15px var(--body);padding:6px 12px;border-radius:6px;border:0;background:#fff;color:#151a21;cursor:pointer}
.foot{color:var(--muted);font-size:14px;max-width:80ch}

/* redrawn plan + 3D */
:root{--t-spot:#e0553a;--t-wash:#2f86d6;--t-par:#1f9d68;--t-fres:#8b5cf6;--t-prof:#c98a00;--t-blind:#d4489a;--t-strobe:#64748b;--t-haze:#7c8a99;--t-proj:#0d9488;--t-mate:#0ea5e9;--t-batten:#b45309;
  --deck:#e6ebf0;--deck-edge:#9aa6b2;--truss:#6b7682;--grid:#e3e8ed}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--deck:#232b35;--deck-edge:#5d6976;--truss:#8b97a3;--grid:#1f262e}}
:root[data-theme="dark"]{--deck:#232b35;--deck-edge:#5d6976;--truss:#8b97a3;--grid:#1f262e}
.viz{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.viz{grid-template-columns:minmax(0,1fr)}}
.plan,.three{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.plan .scroll{overflow-x:auto}
.plan svg{display:block;width:100%;min-width:540px;height:auto}
.vhd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vhd .btns{display:flex;gap:4px}
.vhd .btns button{font:600 13px var(--body);letter-spacing:0;text-transform:none;padding:3px 9px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.vhd .btns button:hover,.vhd .btns button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.stage3d{position:relative;height:380px;touch-action:none;cursor:grab;overflow:hidden;border-radius:0 0 8px 8px}
.stage3d:active{cursor:grabbing}
.stage3d canvas{display:block;width:100%!important;height:100%!important}
.tip{position:absolute;pointer-events:none;background:var(--tape);color:#eef2f5;font-size:12px;line-height:1.35;padding:6px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.tip b{font-family:var(--mono);font-weight:500}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:20px;height:16px}
.vnote{font-size:13px;color:var(--muted);max-width:90ch;margin:0}
.pl-grid{stroke:var(--grid);stroke-width:1}
.pl-deck{fill:var(--deck);stroke:var(--deck-edge);stroke-width:1.5}
.pl-wall{fill:var(--deck-edge)}
.pl-cl{stroke:var(--deck-edge);stroke-width:1;stroke-dasharray:10 4 2 4}
.pl-bar{fill:url(#truss);stroke:var(--truss);stroke-width:1.2}
.pl-seg{stroke:var(--truss);stroke-width:9;stroke-linecap:round;opacity:.55}
.pl-lab{fill:var(--ink);font:600 15px var(--display);letter-spacing:.05em}
.pl-dim{fill:var(--muted);font:12px var(--mono)}
.pl-id{fill:var(--ink);font:500 10.5px var(--mono);text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.pl-small{fill:var(--muted);font:12px var(--body)}
.pl-focus{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:5 4;opacity:.75}
.pl-ftarget{fill:none;stroke:var(--accent);stroke-width:1.5}
.fx{cursor:pointer}
.fx .sym{stroke:var(--panel);stroke-width:1.5}
.fx:hover .ring,.fx.sel .ring{opacity:1}
.ring{fill:none;stroke:var(--accent);stroke-width:2.5;opacity:0}
.fx:focus-visible{outline:none}.fx:focus-visible .ring{opacity:1}
tr.flash td{background:var(--hl)!important;transition:background .3s}
.plan.is-full,.three.is-full{display:flex;flex-direction:column;border-radius:0;border:0;width:100%;height:100%}
.is-max{position:fixed;inset:0;z-index:30;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.plan.is-full .scroll{flex:1;min-height:0;overflow:auto}
.plan.is-full svg{min-width:0;width:100%;height:100%}
.three.is-full .stage3d{flex:1;height:auto;min-height:0;border-radius:0}
.plan:fullscreen,.three:fullscreen{background:var(--panel)}
@media (prefers-reduced-motion:no-preference){.tab{transition:background .15s,color .15s}}
</style>

function patchIndex(rows){const m=new Map();for(const r of rows)if(r.length>1)m.set(String(r[0]),r);return m}
/* An imported MA3 patch may number fixtures differently from the venue plot, so only link a plot fixture
   to an imported row when the fixture types share a name token. */
const KIND_SKIP=new Set(["stage","acme","colour","color","pro","led","mode","channel","the","chauvet","ckc","tourpro","ip","std"]);
const kindTokens=s=>String(s).toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>=3&&!KIND_SKIP.has(t)&&!/^\d+$/.test(t));
function sameKind(a,b){const A=kindTokens(a),B=kindTokens(b);return A.some(x=>B.some(y=>x.includes(y)||y.includes(x)))}
function rowFor(v,idx,f){const row=idx.get(String(f.id));if(!row)return null;if(IMPORTED[v.id]&&!sameKind(f.name,row[1]))return null;return row}

    if(r.stage)g+=`<text class="pl-dim" x="${lx.toFixed(1)}" y="${(+Y(yy)+16).toFixed(1)}">${b.planY!=null?esc(b.dimNote):(b.y>=0?"+":"")+b.y.toFixed(1)+" m"} \u00b7 trim ~${b.z} m</text>`});

const pad3=n=>String(n).padStart(3,"0");

  const hi=s=>{const t=esc(s);if(!needle)return t;const i=String(s).toLowerCase().indexOf(needle);return i<0?t:esc(String(s).slice(0,i))+"<mark>"+esc(String(s).slice(i,i+needle.length))+"</mark>"+esc(String(s).slice(i+needle.length))};
  for(const r of rows){
    if(r.length===1){pending=r[0];continue}
    const [fid,fx,mode,ch,u,a,loc]=r; const end=a+ch-1;
    const hay=`${fid} ${fx} ${mode} ${u}.${a} ${loc}`.toLowerCase();
    if(needle&&!hay.includes(needle))continue;
    if(pending){out+=`<tr class="grp"><td colspan="6">${esc(pending)}</td></tr>`;pending=null}
    out+=`<tr data-fid="${esc(fid)}"><td class="n fid">${hi(fid)}</td><td>${hi(fx)}</td><td>${hi(mode)}</td><td class="n"><span class="uni">${u}</span>${pad3(a)}</td><td class="n">${end>512?`<span style="color:var(--bad)">${end}</span>`:pad3(end)}</td><td>${hi(loc)}</td></tr>`; n++;
  }

    else if(c==='"')q=true;else if(c===","){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()!==""))out.push(row);row=[];cell=""}
    else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()!==""))out.push(row);return out}
function ma3Rows(text){
  const t=parseCSV(text.replace(/^\ufeff/,""));if(t.length<2)throw new Error("The file has no fixture rows.");
  const head=t[0].map(h=>h.trim().toLowerCase()),col=(...names)=>head.findIndex(h=>names.includes(h));
  const ci={fid:col("fixture id","fid","id"),fx:col("fixture","fixture type","type"),mode:col("mode"),u:col("universe","uni"),a:col("address","addr"),e:col("end"),loc:col("location","name","layer","position / notes")};
  if(ci.fid<0||ci.u<0||ci.a<0)throw new Error("Expected Fixture ID, Universe and Address columns. Export the file with the Venue Patch Export plugin.");
  const rows=[["Imported from MA3"]];
  for(const r of t.slice(1)){const u=parseInt(r[ci.u],10),a=parseInt(r[ci.a],10);if(!(u>0&&a>0))continue;
    const e=parseInt(ci.e>=0?r[ci.e]:"",10),m=ci.mode>=0?r[ci.mode].trim():"";
    const ch=e>=a?e-a+1:(parseInt((m.match(/(\d+)\s*ch/i)||[])[1],10)||1);
    const id=r[ci.fid].trim();rows.push([/^\d+$/.test(id)?+id:id,ci.fx>=0?r[ci.fx].trim():"",m,ch,u,a,ci.loc>=0?r[ci.loc].trim():""])}
  if(rows.length<2)throw new Error("No patched fixtures with a universe and address were found.");
  return rows}

/* ---------- fullscreen: real Fullscreen API where allowed, otherwise a fixed overlay ---------- */
function fsLabel(box,on){const b=box.querySelector('[id^="fs-"]');if(b){b.setAttribute("aria-pressed",on);b.textContent=on?"Exit fullscreen":"Fullscreen"}}
function setMax(box,on){box.classList.toggle("is-max",on);box.classList.toggle("is-full",on);fsLabel(box,on);document.body.style.overflow=on?"hidden":""}
function toggleFull(box){
  const cur=document.fullscreenElement||document.webkitFullscreenElement;
  if(cur===box){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(box.classList.contains("is-max")){setMax(box,false);return}
  const req=box.requestFullscreen||box.webkitRequestFullscreen,fallback=()=>setMax(box,true);
  if(!req)return fallback();
  let done=false;const fb=()=>{if(!done){done=true;fallback()}};
  try{const p=req.call(box);if(p&&p.then)p.then(()=>{done=true},fb)}catch(_){fb()}
  setTimeout(()=>{if(!(document.fullscreenElement||document.webkitFullscreenElement))fb()},600)
}
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{
  const cur=document.fullscreenElement||document.webkitFullscreenElement;
  document.querySelectorAll("#plan-box,#three-box").forEach(b=>{if(b.classList.contains("is-max"))return;b.classList.toggle("is-full",b===cur);fsLabel(b,b===cur)})}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".is-max").forEach(b=>setMax(b,false))});

/* CSV for the Venue Patch Import plugin. MA3 axes: X across (negative = stage right), Y upstage from the DSE, Z from the floor. */
function ma3CSV(v){
  const r=RIGS[v.id],idx=noLookup(v)?new Map():patchIndex(patchFor(v)),deck=r.stage?r.stage.deck:0,n=x=>(Math.round(x*100)/100).toString();
  const q=s=>{s=String(s??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const out=["Fixture ID,Name,Fixture,Mode,Channels,Universe,Address,Generic,X,Y,Z,Position,Focus X,Focus Y,Focus Z,Focus"],FOC=r.focus||{};
  for(const f of r.fx){if(f.t==="proj")continue;const row=rowFor(v,idx,f);
    const fromMA=v.id==="factory"&&!IMPORTED[v.id]&&row&&row[6];
    const name=fromMA?row[6].split(" \u00b7 ")[0]:`${fxPos(f)||f.name} ${f.id}`;
    out.push([f.id,name,row?row[1]:f.name,row?row[2]:"",row?row[3]:"",row?row[4]:"",row?row[5]:"",f.t,n(f.x),n(f.y),n(f.z+deck),fxPos(f)||"Rig",...(FOC[f.id]?[n(FOC[f.id].x),n(FOC[f.id].y),n(FOC[f.id].z+deck),FOC[f.id].label]:["","","",""])].map(q).join(","))}
  return out.join("\n")+"\n"}

/* ---------- MVR export: GeneralSceneDescription.xml in a stored (uncompressed) zip ----------
   MVR axes: millimetres, X across (negative = stage right), Y upstage from the DSE, Z up from the floor.
   Fixtures keep the default orientation (beam pointing down). GDTF files aren't included. */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  for(const f of files){const name=enc.encode(f.name),d=f.data,crc=crc32(d);
    const head=[...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(name.length),...u16(0)];
    parts.push(new Uint8Array(head),name,d);
    central.push([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)],name);
    off+=head.length+name.length+d.length}
  let cdLen=0;const cd=[];for(let i=0;i<central.length;i+=2){const h=new Uint8Array(central[i]);cd.push(h,central[i+1]);cdLen+=h.length+central[i+1].length}
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdLen),...u32(off),...u16(0)]);
  const all=[...parts,...cd,end],out=new Uint8Array(all.reduce((s,p)=>s+p.length,0));let p=0;for(const a of all){out.set(a,p);p+=a.length}return out}
const xmlEsc=s=>String(s).replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&apos;"}[c]));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)})).toUpperCase();
function mvrXML(v){
  const r=RIGS[v.id],idx=noLookup(v)?new Map():patchIndex(patchFor(v)),deck=r.stage?r.stage.deck:0,mm=n=>(Math.round(n*1000)).toString();
  const FOC=r.focus||{},fpts=[],fref={};
  for(const [id,fo] of Object.entries(FOC)){const u=uuid();fref[id]=u;fpts.push(`<FocusPoint name="${xmlEsc(id+" "+fo.label)}" uuid="${u}"><Matrix>{1,0,0}{0,1,0}{0,0,1}{${mm(fo.x)},${mm(fo.y)},${mm(fo.z+deck)}}</Matrix></FocusPoint>`)}
  const layers=new Map();
  for(const f of r.fx){if(f.t==="proj")continue;const k=fxPos(f)||"Rig";if(!layers.has(k))layers.set(k,[]);layers.get(k).push(f)}
  const fixtureXML=f=>{const row=rowFor(v,idx,f),name=row?row[1]:f.name,mode=row?row[2]:"",idn=/^\d+$/.test(String(f.id))?String(f.id):"0";
    const addr=row&&row[4]>0&&row[5]>0?`<Addresses><Address break="0">${(row[4]-1)*512+row[5]}</Address></Addresses>`:"";
    return `<Fixture name="${xmlEsc(name+" "+f.id)}" uuid="${uuid()}"><Matrix>{1,0,0}{0,1,0}{0,0,1}{${mm(f.x)},${mm(f.y)},${mm(f.z+deck)}}</Matrix><GDTFSpec>${xmlEsc(name)}.gdtf</GDTFSpec><GDTFMode>${xmlEsc(mode)}</GDTFMode>${fref[f.id]?`<Focus>${fref[f.id]}</Focus>`:""}<FixtureID>${xmlEsc(f.id)}</FixtureID><FixtureIDNumeric>${idn}</FixtureIDNumeric><UnitNumber>0</UnitNumber>${addr}</Fixture>`};
  const body=(fpts.length?`<Layer name="Focus points" uuid="${uuid()}"><ChildList>${fpts.join("")}</ChildList></Layer>`:"")+[...layers].map(([name,list])=>`<Layer name="${xmlEsc(name)}" uuid="${uuid()}"><ChildList>${list.map(fixtureXML).join("")}</ChildList></Layer>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n<GeneralSceneDescription verMajor="1" verMinor="6" provider="Sydney Venue Spec Pack" providerVersion="1.0"><UserData/><Scene><AUXData/><Layers>${body}</Layers></Scene></GeneralSceneDescription>\n`}
function buildMVR(v){return zipStore([{name:"GeneralSceneDescription.xml",data:new TextEncoder().encode(mvrXML(v))}])}

function render(id){
  const v=VENUES.find(x=>x.id===id)||VENUES[0];
  if(kill3D){kill3D();kill3D=null}
  document.body.style.overflow="";
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.id===v.id));
  let h=`<article class="venue"><div class="vhead"><div><h2>${esc(v.name)}</h2><div class="addr">${esc(v.addr)}</div></div><div class="chips">${v.chips.map(([k,t])=>`<span class="chip ${k}">${esc(t)}</span>`).join("")}</div></div>`;
  if(v.note)h+=`<div class="note">${v.note}</div>`;
  h+=stats(v.stats);
  h+=block(v.rig.title,v.rig.src,`<div class="cols">${v.rig.groups.map(([t,items])=>`<div class="card"><h4>${esc(t)}</h4>${list(items)}</div>`).join("")}</div>`);
  const rows=patchFor(v),imp=IMPORTED[v.id],total=rows.filter(r=>r.length>1).length;
  h+=block(imp?"Patch (imported from MA3)":v.patch.title,imp?`${imp.file} \u00b7 imported ${imp.when}`:v.patch.src,`${imp?`<div class="note"><strong>Showing your MA3 export.</strong> It is saved in this browser only. Published patch: ${esc(v.patch.title)}.</div>`:""}<div class="tools"><input type="search" id="q-${v.id}" placeholder="Filter by ID, fixture, address or position" aria-label="Filter patch"><button class="btn" type="button" id="csv-${v.id}">Copy as CSV</button><label class="btn" for="imp-${v.id}">Import MA3 CSV</label><input type="file" id="imp-${v.id}" accept=".csv,text/csv,text/plain" hidden>${imp?`<button class="btn" type="button" id="rev-${v.id}">Show published patch</button>`:""}<span class="count" id="count-${v.id}">${total} fixtures</span></div>
    <div class="tablebox"><table class="patch"><thead><tr><th>ID</th><th>Fixture</th><th>Mode</th><th>Uni / Addr</th><th>End</th><th>Position / notes</th></tr></thead><tbody id="pb-${v.id}"></tbody></table></div>`);
  const rg=RIGS[v.id];
  if(!rg)h+=block("Lighting plan","",`<p class="vnote">${esc(v.noPlot||"No lighting plot is published for this venue, so there's no plan or 3D view.")}</p>`);
  else h+=block("Lighting plan","Hover or click a fixture to find it in the patch",`<div class="viz">
      <div class="plan" id="plan-box"><div class="vhd"><span>Plan view, upstage at top</span><div class="btns"><button type="button" id="fs-plan" aria-pressed="false">Fullscreen</button></div></div><div class="scroll">${planSVG(v)}</div></div>
      <div class="three" id="three-box"><div class="vhd"><span>3D view</span><div class="btns"><button type="button" id="z-spin" aria-pressed="${spinPref}">Spin</button><button type="button" id="z-in" aria-label="Zoom in">+</button><button type="button" id="z-out" aria-label="Zoom out">\u2212</button><button type="button" id="z-beam" aria-pressed="true">Beams</button><button type="button" id="z-reset">Reset</button><button type="button" id="fs-3d" aria-pressed="false">Fullscreen</button></div></div><div class="stage3d" id="s3d"></div></div>
    </div>${legend(rg)}<p class="vnote">${esc(rg.note)}</p><div class="tools"><button class="btn" type="button" id="mvr-save" hidden>Save MVR</button><button class="btn" type="button" id="ma3-save" hidden>Save MA3 import CSV</button><button class="btn" type="button" id="ma3-copy">Copy MA3 import CSV</button><span class="count" id="ma3-msg">MVR: the rig as a 3D scene for MA3, Vectorworks or Capture. MA3 CSV: for the Venue Patch Import plugin (positions, focus and placeholders).</span></div>`);
  if(v.drawings&&v.drawings.length)h+=block("Venue drawings","The original sheets. Click one to view it full size.",`<div class="drawings">${v.drawings.map(([src,t,c])=>`<figure><a href="${src}" data-lb="${src}" aria-label="Open ${esc(t)} full size"><img src="${src}" alt="${esc(t)}" loading="lazy"></a><figcaption><b>${esc(t)}.</b> ${esc(c)}</figcaption></figure>`).join("")}</div>`);
  if(v.network)h+=block("DMX network","Enmore DMX node gateway upgrade",`<div class="cols"><div class="card">${kvTable(v.network.slice(0,6))}</div><div class="card">${kvTable(v.network.slice(6))}</div></div>`);
  if(v.info)h+=block("Stage, power and audio","",`<div class="cols">${v.info.map(([t,rows])=>`<div class="card"><h4>${esc(t)}</h4>${kvTable(rows)}</div>`).join("")}</div>`);
  if(v.rooms)h+=v.rooms.map(r=>block(r.name,r.src,`${stats(r.stats)}<div class="cols">${r.lists.map(([t,items])=>`<div class="card"><h4>${esc(t)}</h4>${list(items)}</div>`).join("")}</div>`)).join("");
  h+=block("Source documents","Links open the venue's PDF in a new tab",`<ul class="srcs">${v.sources.map(([t,p,d])=>`<li>${/^Supplied/.test(p)?`${esc(t)}<span class="d">${esc(p.replace(/^Supplied pack: /,"In the supplied pack: "))}</span>`:`<a href="${/^https?:/.test(p)?p:S3+p}" target="_blank" rel="noopener">${esc(t)}</a><span class="d">${esc(d)}</span>`}</li>`).join("")}</ul>`);
  h+=`<p class="foot">Specs change between shows. Confirm the rig, patch and power with ${v.contact||"Century Venues production on <b>+61 2 9519 9231</b>"} during advancing.</p></article>`;
  document.getElementById("view").innerHTML=h;

  const tb=document.getElementById("pb-"+v.id), q=document.getElementById("q-"+v.id), cnt=document.getElementById("count-"+v.id);
  const draw=()=>{const r=patchBody(rows,q.value);tb.innerHTML=r.html;cnt.textContent=q.value.trim()?`${r.n} of ${total} fixtures`:`${total} fixtures`};
  q.addEventListener("input",draw); draw();
  const csvBtn=document.getElementById("csv-"+v.id);
  csvBtn.addEventListener("click",()=>{const txt=patchCSV(rows);
    navigator.clipboard.writeText(txt).then(()=>{csvBtn.textContent="Copied";setTimeout(()=>csvBtn.textContent="Copy as CSV",1600)})
    .catch(()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="width:100%;height:160px;font:12px var(--mono)";csvBtn.closest(".block").appendChild(ta);ta.select();csvBtn.textContent="Select and copy below"})});
  const impIn=document.getElementById("imp-"+v.id);
  impIn.addEventListener("change",()=>{const file=impIn.files&&impIn.files[0];if(!file)return;
    file.text().then(txt=>{
      try{const rows=ma3Rows(txt);IMPORTED[v.id]={rows,file:file.name,when:new Date().toLocaleString("en-AU",{dateStyle:"medium",timeStyle:"short"})};
        try{localStorage.setItem("ma3:"+v.id,JSON.stringify(IMPORTED[v.id]))}catch(_){}
        render(v.id)}
      catch(err){cnt.textContent=err.message;cnt.style.color="var(--bad)"}})});
  const rev=document.getElementById("rev-"+v.id);
  if(rev)rev.addEventListener("click",()=>{delete IMPORTED[v.id];try{localStorage.removeItem("ma3:"+v.id)}catch(_){}render(v.id)});
  const pick=fid=>{
    document.querySelectorAll(".fx.sel").forEach(g=>g.classList.remove("sel"));
    document.querySelectorAll(`.fx[data-fid="${CSS.escape(fid)}"]`).forEach(g=>g.classList.add("sel"));
    if(noLookup(v))return;
    const pf=RIGS[v.id].fx.find(x=>String(x.id)===fid);
    if(pf&&IMPORTED[v.id]&&!rowFor(v,patchIndex(rows),pf))return;
    let tr=tb.querySelector(`tr[data-fid="${CSS.escape(fid)}"]`);
    if(!tr&&q.value){q.value="";draw();tr=tb.querySelector(`tr[data-fid="${CSS.escape(fid)}"]`)}
    if(!tr)return;
    tr.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
    tr.classList.add("flash");setTimeout(()=>tr.classList.remove("flash"),1800)};
  document.querySelectorAll(".fx").forEach(g=>{g.addEventListener("click",()=>pick(g.dataset.fid));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(g.dataset.fid)}})});
  if(rg){
  const s3d=document.getElementById("s3d");
  try{kill3D=mount3D(s3d,v,pick,on=>setSpin(on,false))}catch(err){s3d.innerHTML=`<div class="empty">The 3D view couldn't start in this browser.</div>`}
  const api=()=>s3d._api;
  document.getElementById("z-in").onclick=()=>api()&&api().zoom(0.8);
  document.getElementById("z-out").onclick=()=>api()&&api().zoom(1.25);
  document.getElementById("z-reset").onclick=()=>api()&&api().reset();
  const spinBtn=document.getElementById("z-spin");
  function setSpin(on,fromUser){spinPref=on;spinBtn.setAttribute("aria-pressed",on);if(fromUser){api()&&api().spin(on);try{localStorage.setItem("spin",on?"1":"0")}catch(_){}}}
  spinBtn.onclick=()=>setSpin(spinBtn.getAttribute("aria-pressed")!=="true",true);
  const fsPlan=document.getElementById("fs-plan"),fs3d=document.getElementById("fs-3d");
  fsPlan.onclick=()=>toggleFull(document.getElementById("plan-box"),fsPlan);
  fs3d.onclick=()=>toggleFull(document.getElementById("three-box"),fs3d);
  const ma3Msg=document.getElementById("ma3-msg"),ma3Save=document.getElementById("ma3-save"),ma3Copy=document.getElementById("ma3-copy");
  const csvName=`${v.id}-ma3-import.csv`;
  const mvrSave=document.getElementById("mvr-save");
  if(window.claude&&window.claude.use)window.claude.use("downloads").then(dl=>{if(!dl)return;mvrSave.hidden=false;mvrSave.onclick=()=>dl.save({filename:`${v.id}.mvr.zip`,data:new Blob([buildMVR(v)])}).then(()=>{ma3Msg.textContent=`Saved ${v.id}.mvr.zip. Rename it to ${v.id}.mvr (remove .zip), then import it. Map the fixture types to your library's GDTFs when asked.`;ma3Msg.style.color=""}).catch(e=>{ma3Msg.textContent=e&&e.code==="declined"?"Save cancelled.":"This view can't save files."});ma3Save.hidden=false;ma3Save.onclick=()=>dl.save({filename:csvName,data:ma3CSV(v)}).then(()=>{ma3Msg.textContent=`Saved ${csvName}. In MA3, run Venue Patch Import and point it at that file.`;ma3Msg.style.color=""}).catch(e=>{ma3Msg.textContent=e&&e.code==="declined"?"Save cancelled.":"This view can't save files. Use Copy instead.";})}).catch(()=>{});
  ma3Copy.onclick=()=>{const txt=ma3CSV(v);navigator.clipboard.writeText(txt).then(()=>{ma3Msg.textContent=`Copied. Paste it into a text file named ${csvName}, then run Venue Patch Import in MA3.`}).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="width:100%;height:160px;font:12px var(--mono)";ma3Copy.closest(".block").appendChild(ta);ta.select();ma3Msg.textContent="Select the text below and copy it."})};
  const zb=document.getElementById("z-beam");zb.onclick=()=>{const on=zb.getAttribute("aria-pressed")!=="true";zb.setAttribute("aria-pressed",on);api()&&api().beams(on)};
  }
  document.querySelectorAll("[data-lb]").forEach(a=>a.addEventListener("click",e=>{e.preventDefault();openLB(a.dataset.lb,a.querySelector("img").alt)}));
}

const lb=document.getElementById("lb"), lbImg=document.getElementById("lbImg");
function openLB(src,alt){lbImg.src=src;lbImg.alt=alt;lb.hidden=false;document.getElementById("lbClose").focus()}
function closeLB(){lb.hidden=true;lbImg.removeAttribute("src")}
document.getElementById("lbClose").addEventListener("click",closeLB);
lb.addEventListener("click",e=>{if(e.target===lb)closeLB()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!lb.hidden)closeLB()});

const tabs=document.getElementById("tabs");
tabs.innerHTML=VENUES.map(v=>`<button class="tab" role="tab" type="button" data-id="${v.id}">${esc(v.tab)}</button>`).join("");
tabs.addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;render(b.dataset.id);try{history.replaceState(null,"","#"+b.dataset.id)}catch(_){}try{localStorage.setItem("venue",b.dataset.id)}catch(_){}window.scrollTo({top:0})});
let start=(location.hash||"").slice(1);
if(!VENUES.some(v=>v.id===start)){try{start=localStorage.getItem("venue")||""}catch(_){start=""}}
render(VENUES.some(v=>v.id===start)?start:"factory");
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VENUES.some(v=>v.id===h))render(h)});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{const t=document.querySelector(".tab[aria-selected=\"true\"]");if(t)render(t.dataset.id)})}catch(_){}
</script>
